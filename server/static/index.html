<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aster & Row Support Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --user-bubble: #1e3a8a;
      --bot-bubble: #1e293b;
      --tag-bg: #0f172a;
      --warn-bg: #78350f;
      --warn-text: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      width: 95%;
      max-width: 900px;
      height: 92vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .chat-header {
      padding: 18px 24px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .brand-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      color: var(--text);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border);
    }

    .metadata {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .source-tag {
      font-size: 0.75rem;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .handoff-alert {
      font-size: 0.8rem;
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    .chat-input-area {
      padding: 18px 24px;
      background: #0f172a;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .send-button {
      padding: 14px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-button:hover {
      background: var(--accent-hover);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="brand">
        <div class="brand-icon">🌿</div>
        <div class="brand-text">
          <h1>Aster &amp; Row AI Support</h1>
          <p>Grounded RAG &bull; Gemini 2.0 Flash &bull; ChromaDB</p>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        <div class="bubble">Hello! I'm the Aster &amp; Row AI Support Assistant. How can I help you with our products, returns, shipping, or order status today?</div>
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" class="chat-input" placeholder="Ask a question or track an order (e.g. 'Where is ORD-1007?')" autocomplete="off" />
      <button type="submit" id="sendBtn" class="send-button">Send</button>
    </form>
  </div>

  <script>
    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    let sessionId = 'session_' + Math.random().toString(36).substring(2, 9);

    function appendMessage(text, role, metadata = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msgDiv.appendChild(bubble);

      if (metadata && role === 'bot' && metadata.handoff_recommended) {
        const metaDiv = document.createElement('div');
        metaDiv.className = 'metadata';

        const handoff = document.createElement('div');
        handoff.className = 'handoff-alert';
        handoff.textContent = '⚠ Human Support Recommended';
        metaDiv.appendChild(handoff);

        msgDiv.appendChild(metaDiv);
      }

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;

      appendMessage(query, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query, session_id: sessionId })
        });
        const data = await res.json();
        appendMessage(data.text, 'bot', data);
      } catch (err) {
        appendMessage('Sorry, there was an error connecting to the support agent.', 'bot');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
